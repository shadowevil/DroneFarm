name: Deploy wwwroot to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Static site, no build step — publish wwwroot as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
